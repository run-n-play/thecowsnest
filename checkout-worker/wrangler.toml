# The Cows Nest – shop Worker (Square)
# Secrets (never put these in this file):
#   npx wrangler secret put SQUARE_ACCESS_TOKEN
#   npx wrangler secret put SIGNING_SECRET
#   npx wrangler secret put SQUARE_WEBHOOK_KEY   (order emails: Square webhook signature key)
name = "cowsnest-shop"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [ { pattern = "shop.thecowsnest.com", custom_domain = true } ]

[vars]
SITE_URL = "https://thecowsnest.com"
ALLOWED_ORIGINS = "https://thecowsnest.com,https://www.thecowsnest.com,http://127.0.0.1:5500"
SQUARE_ENV = "production"
SQUARE_LOCATION_ID = "LD5TDNMZZTG7Y"
ORDER_EMAIL_TO = "thecowsnestsc@gmail.com"
ORDER_EMAIL_FROM = "orders@thecowsnest.com"

# Digital downloads storage. Turned off until R2 is enabled; remove the # from the
# three lines below after running: npx wrangler r2 bucket create cowsnest-downloads
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "cowsnest-downloads"

# Order emails. Turned off until Email Routing is on for thecowsnest.com and
# thecowsnestsc@gmail.com is a verified destination. Then remove the # from these 3 lines.
# [[send_email]]
# name = "ORDER_MAIL"
# destination_address = "thecowsnestsc@gmail.com"
