# The Cows Nest – shop Worker (Square)
# Secrets (never put these in this file):
#   npx wrangler secret put SQUARE_ACCESS_TOKEN   # sandbox token first, production when going live
#   openssl rand -hex 32 | npx wrangler secret put SIGNING_SECRET
name = "cowsnest-shop"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
SITE_URL = "https://thecowsnest.com"
ALLOWED_ORIGINS = "https://thecowsnest.com,https://www.thecowsnest.com,http://localhost:8000"
SQUARE_ENV = "sandbox"                 # change to "production" with the production token
SQUARE_LOCATION_ID = "REPLACE_ME"      # Square Dashboard > Settings > Locations (sandbox and production differ)

# Digital download files:  npx wrangler r2 object put cowsnest-downloads/<file> --file <local> --remote
[[r2_buckets]]
binding = "FILES"
bucket_name = "cowsnest-downloads"
